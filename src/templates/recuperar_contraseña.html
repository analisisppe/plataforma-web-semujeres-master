{%extends 'main.html' %}

        {% block content %}
        <div class="container-home">
         
<div class="container-register">
    <div class="content-register">

        
     <p class="register-title-web">RECUPERAR CONTRASEÑA</p>
   
 
    {% if message%}
       {%if class == 'blue'%}
        <label class="alert alert-primary">{{message}}</label>
        {%elseif class == 'red'%}
        <label class="alert alert-danger">{{message}}</label>
        {%endif%}
    {% endif%}
     <form class="form-row register"method="POST" autocomplete="on">
        
      <div class="col-md-5">       
        <label class="form-label">Ingrese su correo</label>
        <input name="correo" id="correo" class="form-control" type="email" placeholder="correo@email.com" required>
        <div class="btn-recovery">
        <button id='signup-btn' type="submit" class="btn register">ENVIAR</button>  
        </div>
    </div>
    </div>
               
     
     </form>

 </div>

        </div>
        </div>
 {% endblock %}
